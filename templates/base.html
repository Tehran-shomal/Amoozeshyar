{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#122e63">
    <title>{% block title %}آموزشیار | {{ page_title|default:"پورتال دانشجویی" }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/portal.css' %}">
    <link rel="stylesheet" href="{% static 'core/responsive.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block content %}{% endblock %}
    <script src="{% static 'core/portal_api.js' %}" defer></script>
    <script src="{% static 'core/live_portal.js' %}" defer></script>
    {% if module_js %}<script src="{% static module_js %}" defer></script>{% endif %}
</body>
</html>
